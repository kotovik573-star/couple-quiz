    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .menu { display: grid; gap: 15px; margin-bottom: 20px; }

        .btn {
            padding: 18px 24px;
            border: none;
            border-radius: 16px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .btn-create { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .btn-join { background: #f0f0f0; color: #333; }
        .btn-back { background: #eee; color: #666; font-size: 0.9em; padding: 12px 20px; }
        .btn-secondary { background: #e8f5e9; color: #2e7d32; }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .theme-btn {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .theme-btn:hover, .theme-btn.selected {
            border-color: #667eea;
            background: #f8f6ff;
            transform: scale(1.02);
        }

        .theme-btn .emoji { font-size: 2em; display: block; margin-bottom: 8px; }
        .theme-btn .name { font-weight: 600; color: #333; font-size: 0.9em; }

        .room-code {
            background: #f8f6ff;
            border: 2px dashed #667eea;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            margin: 20px 0;
        }

        .code-display {
            font-size: 2.2em;
            font-weight: bold;
            color: #764ba2;
            letter-spacing: 6px;
            margin: 15px 0;
            font-family: monospace;
            word-break: break-all;
        }

        .input-group { margin: 20px 0; }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .question-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .question-number {
            color: #667eea;
            font-weight: 600;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #222;
            line-height: 1.4;
        }

        .options { display: grid; gap: 10px; }

        .option {
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            font-size: 1em;
            text-align: left;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f6ff;
        }

        .option.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .results-header { text-align: center; margin-bottom: 30px; }

        .match-percentage {
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 10px 0;
        }

        .match-label { color: #666; font-size: 1em; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
        }

        .stat-box {
            background: #f8f6ff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #764ba2;
        }

        .stat-label { color: #666; font-size: 0.8em; margin-top: 5px; }

        .comp-item {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .comp-item.match { border-color: #4caf50; background: #f1f8e9; }
        .comp-item.mismatch { border-color: #ff9800; background: #fff8e1; }

        .comp-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 0.95em;
        }

        .comp-answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .comp-answer {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85em;
        }

        .comp-answer.you { background: #667eea; color: white; }
        .comp-answer.partner { background: #764ba2; color: white; }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .badge.match { background: #4caf50; color: white; }
        .badge.mismatch { background: #ff9800; color: white; }

        .waiting-screen { text-align: center; padding: 30px; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .name-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 500;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            font-size: 0.9em;
            max-width: 90%;
            text-align: center;
        }

        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .history-list { margin-top: 20px; }

        .history-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .share-section {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .share-link {
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85em;
            word-break: break-all;
            margin: 10px 0;
            border: 1px solid #ddd;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; border-radius: 20px; }
            h1 { font-size: 1.5em; }
            .theme-grid { grid-template-columns: 1fr; }
            .name-inputs { grid-template-columns: 1fr; }
            .code-display { font-size: 1.8em; letter-spacing: 4px; }
            .stats-grid { grid-template-columns: 1fr; }
            .comp-answers { grid-template-columns: 1fr; }
        }
    </style>

// ==================== УТИЛИТЫ ====================
function generateCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 3; i++) code += chars[Math.floor(Math.random() * chars.length)];
    code += '-';
    for (let i = 0; i < 3; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
}

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function saveToStorage(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch(e) {}
}

function loadFromStorage(key) {
    try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : null;
    } catch(e) { return null; }
}

function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function copyToClipboard(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Скопировано!'));
    } else {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('Скопировано!');
    }
}

// ==================== FIREBASE ФУНКЦИИ ====================
function createFirebaseRoom(roomData) {
    return db.ref('rooms/' + roomData.code).set(roomData);
}

function listenToRoom(code, callback) {
    if (state.unsubscribe) state.unsubscribe();
    const ref = db.ref('rooms/' + code);
    state.roomRef = ref;
    state.unsubscribe = ref.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) callback(data);
    });
    return ref;
}

function updateRoom(code, updates) {
    return db.ref('rooms/' + code).update(updates);
}

        case 'quiz': renderQuiz(app); break;

}

function renderResults(container) {
    const room = state.room;
    const players = Object.keys(room.answers || {});

    if (players.length < 2) {
        container.innerHTML = `
            <button class="btn btn-back" onclick="goTo('menu')">← В меню</button>
            <div style="text-align: center; padding: 40px; color: #666;">
                Партнёр ещё не ответил на вопросы...
            </div>
        `;
        return;
    }

    const myAnswers = room.answers[state.userName] || [];
    const partnerName = players.find(n => n !== state.userName) || 'Партнёр';
    const partnerAnswers = room.answers[partnerName] || [];

    let matches = 0;
    const comparisons = [];

    room.questions.forEach((q, i) => {
        const match = myAnswers[i] === partnerAnswers[i];
        if (match) matches++;
        comparisons.push({
            question: q.q,
            myAnswer: q.a[myAnswers[i]],
            partnerAnswer: q.a[partnerAnswers[i]],
            match: match
        });
    });

    const percentage = Math.round((matches / room.questions.length) * 100);

    saveHistory(room, percentage, matches, room.questions.length, players);

    container.innerHTML = `
        <button class="btn btn-back" onclick="goTo('menu')" style="width: auto; margin-bottom: 15px;">← В меню</button>

        <div class="results-header">

                <div class="stat-label">Разошлось</div>
            </div>
            <div class="stat-box">
                <div class="stat-value">${room.questions.length}</div>
                <div class="stat-label">Вопросов</div>
            </div>
        </div>

            <h3 style="color: #333; margin-bottom: 15px; font-size: 1.1em;">📊 Сравнение ответов</h3>

                <div class="comp-item ${c.match ? 'match' : 'mismatch'}">
                    <div class="comp-question">${i + 1}. ${c.question}</div>
                    <div class="comp-answers">
                        <div class="comp-answer you">${state.userName}: ${c.myAnswer}</div>
                        <div class="comp-answer partner">${partnerName}: ${c.partnerAnswer}</div>

            `).join('')}
        </div>

        <div style="text-align: center; color: #666; font-size: 0.85em; margin-top: 20px; padding: 15px; background: #f8f6ff; border-radius: 12px;">
            ${themes[room.theme].emoji} ${themes[room.theme].name} •

        <button class="btn btn-create" onclick="goTo('create')" style="margin-top: 20px;">

// ==================== ЛОГИКА ====================
function goTo(view) {
    if (state.unsubscribe && view !== 'waiting' && view !== 'results') {
        state.unsubscribe();
        state.unsubscribe = null;
    }
    state.currentView = view;
    render();
}

function selectTheme(theme) {
    document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('selected'));
    document.getElementById(`theme-${theme}`).classList.add('selected');
    state.selectedTheme = theme;
}

function createRoom() {
    const creatorName = document.getElementById('creatorName').value.trim();
    const partnerName = document.getElementById('partnerName').value.trim();

    if (!creatorName || !partnerName) {
        showToast('Введите имена!');
        return;
    }
    if (!state.selectedTheme) {
        showToast('Выберите тему!');
        return;
    }

    state.userName = creatorName;
    state.partnerName = partnerName;

    const allQuestions = questionDB[state.selectedTheme];
    const selectedQuestions = shuffle(allQuestions).slice(0, 10);

    const room = {
        code: generateCode(),
        theme: state.selectedTheme,
        questions: selectedQuestions,
        answers: {},
        creator: creatorName,
        createdAt: Date.now(),
        status: 'waiting'
    };

    state.room = room;
    saveToStorage('lastRoom', room.code);

    // Сохраняем в Firebase
    createFirebaseRoom(room).then(() => {
        state.currentQuestion = 0;
        state.answers = [];
        state.currentView = 'quiz';
        render();
    }).catch(err => {
        showToast('Ошибка создания комнаты');
        console.error(err);
    });
}

function joinRoom() {
    const code = document.getElementById('roomCode').value.trim().toUpperCase();
    const name = document.getElementById('joinerName').value.trim();

    if (!code || !name) {
        showToast('Введите код и имя!');
        return;
    }

    // Проверяем комнату в Firebase
    db.ref('rooms/' + code).once('value').then(snapshot => {
        const room = snapshot.val();
        if (!room) {
            showToast('Комната не найдена!');
            return;
        }

        if (room.answers && room.answers[name]) {
            showToast('Ты уже проходил этот опрос!');
            return;
        }

        state.room = room;
        state.userName = name;
        state.currentQuestion = 0;
        state.answers = [];
        state.currentView = 'quiz';
        render();
    }).catch(err => {
        showToast('Ошибка подключения');
        console.error(err);
    });
}

function answer(idx) {
    state.answers.push(idx);
    state.currentQuestion++;

    if (state.currentQuestion >= state.room.questions.length) {
        // Сохраняем ответы в Firebase
        const updates = {};
        updates['answers/' + state.userName] = state.answers;
        updates['status'] = 'completed';

        updateRoom(state.room.code, updates).then(() => {
            state.room.answers = state.room.answers || {};
            state.room.answers[state.userName] = state.answers;
            state.currentView = 'waiting';

            // Начинаем слушать изменения
            listenToRoom(state.room.code, (roomData) => {
                state.room = roomData;
                const players = Object.keys(roomData.answers || {});
                if (players.length >= 2) {
                    // Проверяем, все ли ответили на все вопросы
                    const allCompleted = players.every(p => roomData.answers[p].length === roomData.questions.length);
                    if (allCompleted && state.currentView === 'waiting') {
                        render(); // Перерисуем с кнопкой результатов
                    }
                }
            });

            render();
        }).catch(err => {
            showToast('Ошибка сохранения');
            console.error(err);
        });
    } else {
        render();
    }
}

function checkResults() {
    if (!state.room) return;

    db.ref('rooms/' + state.room.code).once('value').then(snapshot => {
        const room = snapshot.val();
        if (!room) return;

        state.room = room;
        const players = Object.keys(room.answers || {});
        const allCompleted = players.length >= 2 && players.every(p => room.answers[p].length === room.questions.length);

        if (allCompleted) {
            state.currentView = 'results';
            render();
        } else {
            showToast('Партнёр ещё не закончил...');
        }
    });
}

function showResults() {
    state.currentView = 'results';
    render();
}

function saveHistory(room, percentage, matches, total, players) {
    const history = loadFromStorage('quizHistory') || [];
    const exists = history.some(h => h.code === room.code && h.date === room.createdAt);
    if (exists) return;

    history.push({
        code: room.code,
        theme: room.theme,
        date: room.createdAt,
        players: players || [state.userName, state.partnerName || 'Партнёр'],
        percentage: percentage,
        matches: matches,
        total: total
    });

    if (history.length > 50) history.shift();
    saveToStorage('quizHistory', history);
}

function loadHistoryRoom(code) {
    db.ref('rooms/' + code).once('value').then(snapshot => {
        const room = snapshot.val();
        if (room) {
            state.room = room;
            state.userName = room.creator;
            state.currentView = 'results';
            render();
        } else {
            showToast('Комната больше не существует');
        }
    });
}

function clearHistory() {
    if (confirm('Очистить всю историю?')) {
        localStorage.removeItem('quizHistory');
        render();
    }
}

// ==================== ИНИЦИАЛИЗАЦИЯ ====================
// Проверяем URL параметры (если пришли по ссылке)
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('room');

    if (roomCode) {
        document.getElementById('app').innerHTML = `
            <div style="text-align: center; padding: 40px;">
                <div class="spinner" style="margin: 20px auto;"></div>
                <p>Подключаемся к комнате ${roomCode}...</p>
            </div>
        `;

        db.ref('rooms/' + roomCode.toUpperCase()).once('value').then(snapshot => {
            const room = snapshot.val();
            if (room) {
                state.room = room;
                state.currentView = 'join';
                // Заполним код автоматически
                setTimeout(() => {
                    const codeInput = document.getElementById('roomCode');
                    if (codeInput) codeInput.value = roomCode.toUpperCase();
                }, 100);
                render();
            } else {
                showToast('Комната не найдена');
                render();
            }
        }).catch(() => {
            render();
        });
    } else {
        render();
    }
});
</script>
